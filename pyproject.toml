[tool.ruff]
line-length = 100
target-version = "py311"
# Keep Ruff's default exclusions, including .venv and site-packages.
extend-exclude = ["build", "dist", "installer", "venv", "env"]
force-exclude = true
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["layout_stress: optional forced narrow-panel and oversized-font layout checks"]
[tool.mypy]
files = ["northstar_wireless/domain", "northstar_wireless/services/project_store.py", "northstar_wireless/services/paths.py"]
check_untyped_defs = true
